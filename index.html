<style>
/* Frasquito brand system.
   Coral is identity only — the logo and the primary action. Navy carries every money figure.
   Gold is reward. The three jars sit under all of it in their own triad.
   Every pair below is verified to WCAG AA in both themes. */
:root{
  color-scheme:light;
  --ground:#FFF8F3; --surface:#FFFFFF; --surface-2:#FCF3EB; --ink:#1A1420; --ink-2:#5C5266; --line:#E8DDD4;
  --ctl:#9E8C7E;
  --brand:#E8472A; --brand-deep:#C23318; --on-brand:#FFFFFF;
  --money:#122C5C; --money-soft:#E8EDF7;
  --lemon:#F5C842; --lemon-ink:#2B1F00;
  --save:#0A6B5C; --save-soft:#E3F5F0;
  --spend:#9A3412; --spend-soft:#FBEDE4;
  --give:#5B44D6; --give-soft:#EFEBFD;
  --focus:#122C5C;
  --shadow:0 1px 2px rgba(26,20,32,.06),0 8px 24px -12px rgba(26,20,32,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#17131C; --surface:#221C28; --surface-2:#1D1824; --ink:#F7F0EA; --ink-2:#A99DB0; --line:#322A38;
    --ctl:#7A6E86;
    --brand:#FF6B4A; --brand-deep:#FF8A6E; --on-brand:#2B0E06;
    --money:#7FA5E8; --money-soft:#1C2740;
    --lemon:#F5C842; --lemon-ink:#2B1F00;
    --save:#2DD4BF; --save-soft:#10322E;
    --spend:#FB923C; --spend-soft:#3A2113;
    --give:#A5A0FF; --give-soft:#262048;
    --focus:#7FA5E8; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#17131C; --surface:#221C28; --surface-2:#1D1824; --ink:#F7F0EA; --ink-2:#A99DB0; --line:#322A38;
  --ctl:#7A6E86;
  --brand:#FF6B4A; --brand-deep:#FF8A6E; --on-brand:#2B0E06;
  --money:#7FA5E8; --money-soft:#1C2740;
  --lemon:#F5C842; --lemon-ink:#2B1F00;
  --save:#2DD4BF; --save-soft:#10322E;
  --spend:#FB923C; --spend-soft:#3A2113;
  --give:#A5A0FF; --give-soft:#262048;
  --focus:#7FA5E8; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding-inline:14px;padding-block:10px 92px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.coin{flex:none;width:38px;height:38px;border-radius:9px;overflow:hidden;background:#E8472A;box-shadow:0 1px 0 rgba(16,48,44,.08),0 6px 14px -8px rgba(16,48,44,.5)}
.coin svg{display:block;width:100%;height:100%}
.brand h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.02em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch}
.pill-toggle{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.pill-toggle button{border:0;background:transparent;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink-2)}
.pill-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

.country{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px 5px 5px 12px}
.country label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:700;flex:none}
.country select{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.proto{font-size:11px;color:var(--ink-2);text-align:center;margin:-4px 0 0}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px}
.who button{border:0;background:transparent;border-radius:10px;padding:8px 6px;font-size:15px;font-weight:700;color:var(--ink-2)}
.who button[aria-pressed="true"]{background:var(--lemon);color:var(--lemon-ink)}

.card{background:var(--surface);border-radius:20px;padding:15px;box-shadow:var(--shadow)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}

/* hero balance */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h2{font-size:22px}
.hello>div:first-child{min-width:0;flex:1}
.streak{display:flex;flex-direction:column;align-items:center;background:var(--lemon);color:var(--lemon-ink);border-radius:14px;padding:6px 10px;font-weight:700;font-size:12px;line-height:1.1;flex:none}
.streak b{font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.total{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:42px;letter-spacing:-.03em;margin-top:6px;color:var(--money);font-variant-numeric:tabular-nums}
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.jar{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 2px 10px;border-radius:20px;background:transparent}
.jar-glass{position:relative;width:70px;height:140px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.jar-glass svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes jfloat1{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jfloat2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes jfloat3{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.jf1{animation:jfloat1 2s ease-in-out infinite}
.jf2{animation:jfloat2 2.4s ease-in-out infinite}
.jf3{animation:jfloat3 1.8s ease-in-out infinite}
.jar-fill-clip{transition:height .6s cubic-bezier(.2,.8,.2,1);transform-origin:bottom}
.jar .lbl{font-weight:800;font-size:12px;color:var(--ink);letter-spacing:.01em;line-height:1.2;margin-top:2px}
.jar .amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;color:var(--money);font-variant-numeric:tabular-nums}
.jar .pct{font-size:11px;color:var(--ink-2);font-weight:600}
.settings-toggle{background:none;border:2px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s}
.settings-toggle:hover{background:var(--surface-2)}
.settings-back{background:none;border:none;font-weight:700;font-size:15px;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px;padding:0}

.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal-row h3{font-size:18px}
.bar{height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.bar>i{display:block;height:100%;background:var(--save);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.muted{color:var(--ink-2);font-size:14px}

/* chores */
.list{display:flex;flex-direction:column;gap:10px}
.chore{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.chore .ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:24px;flex:none}
.chore{flex-wrap:wrap}
.chore .txt{flex:1;min-width:8em}
.chore .txt b{display:block}
.chore .txt span{font-size:13px;color:var(--ink-2)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--ink);color:var(--ground);white-space:nowrap}
/* inline brand icons: inherit currentColor so they follow the button's own text colour */
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em;display:inline-block}
.btn .ico{margin-inline-end:.45em}
.btn.lemon{background:var(--lemon);color:var(--lemon-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--save);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap}
.tag.wait{background:var(--lemon);color:var(--lemon-ink)}
.tag.paid{background:var(--save-soft);color:var(--save)}

/* stand */
.stand-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.weather{font-size:13px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.controls{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:18px}
.stepper output{min-width:62px;text-align:center;font-weight:700}
.stepper input[type=number]{appearance:textfield;-webkit-appearance:none}
.stepper input[type=number]::-webkit-inner-spin-button,.stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.receipt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:14px}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .r.t{border-top:1px dashed var(--ink-2);margin-top:6px;padding-top:6px;font-weight:700}
.pos{color:var(--save)} .neg{color:var(--spend)}
.lesson{margin-top:12px;background:var(--give-soft);border-radius:14px;padding:12px;font-size:14px}
.lesson b{color:var(--give)}
.hist{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.hist th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);text-align:right;padding:6px 4px;font-weight:700}
.hist th:first-child,.hist td:first-child{text-align:left}
.hist td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}

/* parent */
.split-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.split-opts button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:700}
.split-opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--ground)}
.form{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:10px}
.form input{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.form .btn{grid-column:1/-1}
.price{background:var(--ink);color:var(--ground);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.price .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:44px;letter-spacing:-.03em;color:var(--lemon)}
.price ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.price .vs{font-size:13px;opacity:.75;margin-top:10px}

/* gifts */
.gift-alert{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:18px;padding:13px;background:var(--give);color:#fff;box-shadow:var(--shadow)}
.gift-alert b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:18px}
.gift-alert span{font-size:14px;opacity:.9}
.gbox{width:56px;height:52px;flex:none;position:relative}
.gbox .lid{position:absolute;left:0;right:0;top:6px;height:14px;border-radius:4px;background:var(--lemon)}
.gbox .body{position:absolute;left:4px;right:4px;top:20px;bottom:0;border-radius:0 0 6px 6px;background:var(--lemon);filter:brightness(.92)}
.gbox .rib{position:absolute;left:50%;top:6px;bottom:0;width:10px;margin-left:-5px;background:var(--spend)}
.gbox .bow{position:absolute;left:50%;top:-2px;width:26px;height:12px;margin-left:-13px;border:4px solid var(--spend);border-radius:50% 50% 0 0}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}
.gift-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.gift-row:first-of-type{border-top:0}
.gift-row .who-i{width:40px;height:40px;border-radius:50%;background:var(--give-soft);color:var(--give);display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;flex:none}
.gift-row .txt{flex:1;min-width:0}
.gift-row .txt b{display:block}
.gift-row .txt span{font-size:13px;color:var(--ink-2)}
.gift-row .note{font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700}
.chips button[aria-pressed="true"]{background:var(--give);border-color:var(--give);color:#fff}
.field-lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-top:14px;display:block}
.gift-form textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;margin-top:8px;resize:vertical;min-height:64px}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(8,20,18,.72);overflow-y:auto;overscroll-behavior:contain}
.modal-card{background:var(--surface);border-radius:28px;padding:28px 22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-card.tight{padding:20px 18px;gap:9px}
.modal-card.tight .bigwho{font-size:38px}
.modal-card.tight h2{font-size:22px}
.modal-card.tight .field-lbl{margin-top:6px}
.modal-card .gbox{width:120px;height:112px}
.modal-card .gbox .lid{height:28px;top:14px;border-radius:8px}
.modal-card .gbox .body{top:42px}
.modal-card .gbox .rib{width:20px;margin-left:-10px;top:14px}
.modal-card .gbox .bow{width:56px;height:26px;margin-left:-28px;top:-6px;border-width:8px}
.modal-card h2{font-size:26px}
.big-amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:52px;letter-spacing:-.03em;color:var(--give);animation:pop .6s cubic-bezier(.2,.9,.3,1.4)}
.modal-card .note{font-size:18px;font-style:italic;background:var(--give-soft);border-radius:16px;padding:12px 14px;width:100%}
.modal-card .btn{width:100%;padding:14px;font-size:17px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

.text-in{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;margin-top:8px}
.chips .text-in{width:9.5em;margin-top:0;padding:8px 12px;border-radius:999px}
.fam-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-block:24px}
.fam-hero .gbox{width:84px;height:78px}
.fam-hero .gbox .lid{height:20px;top:10px}.fam-hero .gbox .body{top:30px}.fam-hero .gbox .rib{width:14px;margin-left:-7px;top:10px}.fam-hero .gbox .bow{width:40px;height:18px;margin-left:-20px;top:-4px;border-width:6px}
.fam-hero h2{font-size:26px}
.linkbox{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border:1px dashed var(--give);border-radius:14px;padding:12px 14px;margin-top:12px;word-break:break-all}
.linkbox span{font-weight:700;color:var(--give)}
.linkbox small{color:var(--ink-2);font-size:12px}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.share-row .btn{white-space:normal;min-width:0;padding:12px 10px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.wa{background:#25D366;color:#08361b}
.locked{display:flex;align-items:center;gap:14px;border:2px dashed var(--give);background:var(--give-soft)}
.locked .boxes{display:flex;flex:none}
.locked .boxes .gbox{width:40px;height:38px;margin-left:-10px}
.locked .boxes .gbox:first-child{margin-left:0}

var DAYOFF=0;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+DAYOFF);return d;};
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;};
const iso=(y,m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const nextOcc=mmdd=>{const [m,d]=mmdd.split("-").map(Number),t=today0();let y=t.getFullYear();if(new Date(y,m-1,d)<t)y++;return iso(y,m,d);};
const daysTo=s=>{const [y,m,d]=s.split("-").map(Number);return Math.round((new Date(y,m-1,d)-today0())/864e5);};

function bbBudget(){ const bases=[5,8,10,12,15]; return bases[Math.floor(Math.random()*bases.length)]; }
function bbItems(budget){
  const pool=shuffle(BB_ITEMS.slice());
  // pick 6 items: ensure at least 2 affordable individually, mix of prices
  const affordable=pool.filter(x=>x.p<=budget);
  const expensive=pool.filter(x=>x.p>budget);
  const picks=[...affordable.slice(0,5),...expensive.slice(0,1)];
  return shuffle(picks).slice(0,6);
}

function awardGame(n,key,cap){ const mt=mathToday(); mt[key]=mt[key]||0;

  S.mathTotal=(S.mathTotal||0)+n; return pay; }

function bonusCard(){
  if(!S.bonus) return "";
  const x=X[S.lang], r=S.bonus/100, sv=S.jars.save;
  const proj = S.age==="c" ? `<div class="proj" aria-hidden="true">${Array.from({length:13},(_,i)=>`<i style="height:${Math.round(sv*Math.pow(1+r,i)/(sv*Math.pow(1+r,12))*100)}%"></i>`).join("")}</div>
    <div class="goal-row muted" style="font-size:12px"><span>${x.now}</span><span>${x.yr}</span></div>
    <p style="margin:6px 0 0;font-weight:700">${x.projection(`<span class="num" style="color:var(--save)">${money(sv*Math.pow(1+r,12))}</span>`)}</p>` : "";
  return `<section class="card bonus"><div class="pctb num">${S.bonus}%</div><div style="flex:1;min-width:0"><b>${x.bonusLine(S.bonus)}</b>
    <span class="muted num">${x.nextBonus(fmtDate(nextMonth1()),money(sv*r))}</span>${proj}</div></section>`;
}
const box = cls => `<div class="gbox ${cls||""}" aria-hidden="true"><div class="body"></div><div class="lid"></div><div class="rib"></div><div class="bow"></div></div>`;
function giftAlert(){
  const g=G[S.lang], waiting=S.gifts.filter(x=>!x.opened&&x.status!=="awaiting"&&unlocked(x));
  if(!waiting.length) return "";
  const first=waiting[0];
  return `<button class="gift-alert" data-a="giftopen" data-v="${first.id}">${box("wiggle")}
    <div><b>${g.have(waiting.length)}</b><span>${g.from(esc(gname(first)))} · ${OCC_ICON[first.occ]} ${g.occs[first.occ]} · ${g.tapOpen}</span></div></button>` + lockedView();
}
function lockedView(){
  const f=F[S.lang], g=G[S.lang], by={};
  S.gifts.filter(x=>!x.opened&&x.status!=="awaiting"&&!unlocked(x)).forEach(x=>{(by[x.opens+"|"+x.occ]=by[x.opens+"|"+x.occ]||[]).push(x);});
  return Object.entries(by).sort().map(([k,list])=>{ const [d,o]=k.split("|");
    return `<section class="card locked"><div class="boxes" aria-hidden="true">${list.slice(0,3).map(()=>box("wiggle")).join("")}</div>
      <div><b>${f.lockedTitle} (${list.length})</b><span class="muted">${OCC_ICON[o]} ${f.lockedSub(g.occs[o],f.daysAway(daysTo(d)))} · ${fmtDate(d)}</span></div></section>`; }).join("");
}
function giftHistory(){
  const g=G[S.lang], got=S.gifts.filter(x=>x.opened).slice().reverse();
  const total=got.reduce((a,x)=>a+x.amt,0);
  return `<details class="card"><summary><span class="eyebrow">${g.history}</span><span class="num muted">${g.total}: <b style="color:var(--give)">${money(total)}</b></span></summary>
    <div style="margin-top:10px">${got.length?got.map(x=>`<div class="gift-row"><div class="who-i">${OCC_ICON[x.occ]}</div>
      <div class="txt"><b>${esc(gname(x))} · <span class="num" style="color:var(--give);font-size:inherit">${money(x.amt)}</span></b><span>${g.occs[x.occ]} · <span class="note">“${esc(noteText(x))}”</span></span></div></div>`).join("")
      :`<p class="muted" style="margin:0">${g.none}</p>`}</div></details>`;
}
function player(msg,mid){ const m=MSG[mid];

  return msg.type==="video" ? `<video src="${m.url}" controls playsinline style="width:100%;border-radius:16px;max-height:260px;background:#000"></video>`
    : `<div class="fakeplay"><span>🎤</span><audio src="${m.url}" controls style="width:100%"></audio></div>`; }
function mediaModal(){ const sf=SF[S.lang], md=S.modal;

/* recording */
const QL={hd:{w:1920,h:1080,fps:30,vb:2500000,ab:128000},std:{w:1280,h:720,fps:30,vb:1200000,ab:96000},low:{w:854,h:480,fps:24,vb:600000,ab:48000}};
function autoQuality(){ const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  if(!c) return "hd";
  if(c.saveData) return "low";
  const et=c.effectiveType||"", dl=c.downlink||10;
  if(et.indexOf("2g")>=0||dl<1) return "low";
  if(et==="3g"||dl<3) return "std";
  return "hd"; }
function qualityNow(){ return autoQuality(); }
function mbPerMin(kind,q){ const p=QL[q]; return Math.round(((kind==="video"?p.vb:0)+p.ab)*60/8/1e6*10)/10; }
function connLabel(){ const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection, sf=SF[S.lang];
  const q=autoQuality(), nm=q==="hd"?sf.qHd:q==="std"?sf.qStd:sf.qLow;
  return c&&c.effectiveType ? `${c.effectiveType.toUpperCase()} → ${nm}` : nm; }
function fallbackRec(){ const md=S.modal; md.stage="done"; md.dur=8; md.fallback=true; md.mid="demo"+Date.now(); render(); }
function startRec(){ const md=S.modal, P=QL[qualityNow()], want=md.kind==="video"
    ? {audio:{echoCancellation:true,noiseSuppression:true,sampleRate:48000},
       video:{facingMode:"user",width:{ideal:P.w},height:{ideal:P.h},frameRate:{ideal:P.fps}}}
    : {audio:{echoCancellation:true,noiseSuppression:true,sampleRate:48000,channelCount:1}};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ fallbackRec(); return; }
  navigator.mediaDevices.getUserMedia(want).then(stream=>{
    rec.stream=stream; rec.chunks=[];
    const opts = md.kind==="video" ? {videoBitsPerSecond:P.vb,audioBitsPerSecond:P.ab} : {audioBitsPerSecond:P.ab};
    const types = md.kind==="video" ? ["video/mp4","video/webm;codecs=vp9,opus","video/webm"] : ["audio/mp4","audio/webm;codecs=opus","audio/webm"];
    const pick = types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
    let mr; try{ mr=new MediaRecorder(stream, pick?{...opts,mimeType:pick}:opts); }catch(e){ try{ mr=new MediaRecorder(stream); }catch(e2){ stream.getTracks().forEach(t=>t.stop()); fallbackRec(); return; } }
    rec.mr=mr; mr.ondataavailable=e=>{ if(e.data.size) rec.chunks.push(e.data); };
    mr.onstop=()=>{ const blob=new Blob(rec.chunks,{type:mr.mimeType||"audio/webm"}), mid="m"+Date.now();
      MSG[mid]={url:URL.createObjectURL(blob),type:md.kind,blob}; const md2=S.modal; if(md2&&md2.type==="rec"){ md2.stage="done"; md2.mid=mid; md2.dur=md2.secs||1; md2.fallback=false; render(); }
      rec.stream&&rec.stream.getTracks().forEach(t=>t.stop()); };
    md.stage="rec"; md.secs=0; render();
    if(md.kind==="video"){ const v=document.getElementById("preview"); if(v){ v.srcObject=stream; } }
    mr.start(); clearInterval(rec.timer);
    rec.timer=setInterval(()=>{ const m=S.modal; if(!m||m.type!=="rec"||m.stage!=="rec"){ clearInterval(rec.timer); return; }
      m.secs++; const t=document.getElementById("rectime"); if(t) t.textContent=m.secs+"s";
      if(m.secs>=60) stopRec(); },1000);
  }).catch(()=>fallbackRec()); }
function stopRec(){ clearInterval(rec.timer); if(rec.mr&&rec.mr.state!=="inactive"){ try{ rec.mr.stop(); }catch(e){ fallbackRec(); } } else fallbackRec(); }

/* confetti */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.getElementById("confetti"), ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols=["#FFD23F","#F0634F","#1F9D63","#6E56E8","#3AB0FF","#FF8FC7"];
  const P=Array.from({length:160},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; cancelAnimationFrame(confetti.raf);
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(++f<180) confetti.raf=requestAnimationFrame(tick); else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

  ${hist.length>0?`<section class="card">

      <b style="font-size:16px">${es?"📋 Historial":pt?"📋 Histórico":"📋 Record"}</b>

function openStand(){
  const s=S.stand, L=t();
  if(s.stock<1){ toast(L.noStock(item())); return; }
  const base={sunny:10,hot:14,cloudy:6,rainy:3}[s.weather];
  const factor=Math.max(0.1,1.6-s.price*0.6);
  const sold=Math.min(s.stock, Math.round(base*factor*(0.8+Math.random()*0.4)));
  const rev=sold*s.price, cost=sold*(s.bizUnitCost!=null?s.bizUnitCost:s.unitCost);
  s.stock-=sold; s.cash+=rev;
  const now=new Date(); const openedAt=now.toISOString();
  const stopTime=s.stopTime||null, supplyCost=s.supplyCost||0, notes=s.notes||'';
  s.last={day:s.day,sold,rev,cost,openedAt,stopTime,supplyCost,notes};
  s.history.push({day:s.day,rev,cost,openedAt,stopTime,supplyCost,notes});
  s.day++; s.startTime=''; s.stopTime=''; s.supplyCost=0; s.notes='';
}

  else if(a==="ledgerall"){ A.ledgerAll=!A.ledgerAll; }
  else if(a==="prize"){ if(v==="0") A.prize.on=false; else { A.prize.on=true; A.prize.amt=+v; } }
  else if(a==="payprize"){ const w=WK[S.lang], st=weekStats();
    if(!A.prize.on||!st.perfect||st.paid) return;
    const amt=A.prize.amt;
    payIntoJars(amt); logMove("prize",amt,{}); flash="jars";
    S.prizePaid=st.ws; toast(w.prizePaid(money(amt))); confetti(); }
  else if(a==="shareopen"){ const h=SH[S.lang], pool=S.jars.give;
    if(pool<=0){ toast(h.empty); return; }
    if(!A.kids.some((k,i)=>i!==A.cur)){ toast(h.noOne); return; }
    S.modal={type:"share",to:null,amt:null}; }
  else if(a==="shwho"){ S.modal.to=+v; }
  else if(a==="shamt"){ S.modal.amt=parseFloat(v); }
  else if(a==="shsend"){ const h=SH[S.lang], md=S.modal;
    if(md.to==null||!md.amt){ toast(h.pickFirst); return; }
    const pool=S.jars.give, amt=Math.min(md.amt,pool);
    if(amt<=0){ toast(h.empty); return; }
    const toName=A.kids[md.to].kidName, fromName=S.kidName;
    S.jars.give-=amt; logMove("shareOut",-amt,{j:"give",n:toName});
    logFor(md.to, "shareIn", amt, {j:"spend",n:fromName});
    A.kids[md.to].jars.spend+=amt;
    S.modal=null; flash="jars"; confetti();
    toast(h.sent(esc(toName), money(amt))); }
  else if(a==="moveopen"){ const h=MV[S.lang];
    if(S.jars.save+S.jars.spend+S.jars.give<=0){ toast(h.none); return; }
    S.modal={type:"move",from:null,to:null,amt:null,typed:false,cash:v==="cash"}; }
  else if(a==="cashopen"){ const h=MV[S.lang];
    if(S.jars.save+S.jars.spend+S.jars.give<=0){ toast(h.none); return; }
    S.modal={type:"move",from:null,to:null,amt:null,typed:false,cash:true}; }
  else if(a==="mvfrom"){ S.modal.from=v; if(S.modal.to===v) S.modal.to=null; }
  else if(a==="mvto"){ S.modal.to=v; }
  else if(a==="mvamt"){ S.modal.amt=parseFloat(v); S.modal.typed=false; }
  else if(a==="mvdo"){ const h=MV[S.lang], JN=jars(), md=S.modal;
    const el=document.getElementById("mvcustom"), typed=el&&el.value!==""?parseFloat(el.value)/m:null;
    const amt=typed!=null?typed:md.amt;
    if(!md.from||(!md.cash&&!md.to)){ toast(h.pick); return; }
    if(!md.cash&&md.from===md.to){ toast(h.same); return; }
    if(!(amt>0)){ toast(h.badAmt); return; }
    if(amt>S.jars[md.from]+1e-9){ toast(h.notEnough(JN[md.from])); return; }
    S.jars[md.from]-=amt;
    if(md.cash){ logMove("cashout",-amt,{j:md.from}); }
    else { S.jars[md.to]+=amt;
      logMove("moveOut",-amt,{j:md.from,n:JN[md.to]});
      logMove("moveIn",amt,{j:md.to,n:JN[md.from]}); }
    S.modal=null; flash="jars"; toneChing();
    toast(md.cash?h.cgave(money(amt),JN[md.from]):h.moved(money(amt),JN[md.from],JN[md.to])); }
  else if(a==="spendopen"){ S.modal={type:"spend",stage:"ask"}; }
  else if(a==="nw"){ const x=X[S.lang], item=document.getElementById("spitem").value.trim(), amt=parseFloat(document.getElementById("spamt").value)/CC().mult;
    if(!item){ document.getElementById("spitem").focus(); return; }
    if(!(amt>0)){ document.getElementById("spamt").focus(); return; }
    if(amt>S.jars.spend+1e-9){ toast(x.notEnough); return; }
    S.modal={type:"spend",stage:"think",item,amt,choice:v}; }
  else if(a==="spendbuy"){ const m=S.modal; S.jars.spend-=m.amt; logMove("buy",-m.amt,{j:"spend",n:esc(m.item)}); flash="jars"; S.modal=null; toast(X[S.lang].bought(money(m.amt))); lessonAfter("needwant"); }
  else if(a==="spendwait"){ S.modal=null; toast(X[S.lang].waited); lessonAfter("needwant"); }
  else if(a==="split"){ S.split=v.split(",").map(Number); }
  else if(a==="splitsave"||a==="splitspend"||a==="splitgive"){ return; } // handled by input event
  else if(a==="delchore"){ S.chores=S.chores.filter(ch=>ch.id!=v); toast(R[S.lang].removed); }
  else if(a==="addchore"){
    const n=document.getElementById("cname").value.trim(), p=parseFloat(document.getElementById("cpay").value);
    if(!n||!(p>0)) return;
    S.chores.push({id:Date.now(),icon:"⭐",en:n,es:n,pt:n,pay:p/m,status:"todo",repeat:document.getElementById("crep").value,kind:document.getElementById("ckind").value}); toast(L.added);
  }
  else if(a==="setgoal"){
    const n=document.getElementById("gname").value.trim(), g=parseFloat(document.getElementById("gamt").value);
    if(n) S.goal.name=n; if(g>0) S.goal.target=g/m; S.goal.won = S.jars.save>=S.goal.target; toast(L.goalSet);
  }
  else if(a==="bizsetup"){
    const nm=document.getElementById("bizName").value.trim();
    const it=document.getElementById("bizItem").value.trim();
    if(!nm||!it){toast(L.bizNamePh||"Enter a name and item");return;}
    const uc=S.stand.bizUnitCost!=null?S.stand.bizUnitCost:0.25/m;
    const qty=S.stand.stock||0;
    S.stand.bizName=nm; S.stand.bizItem=it; S.stand.bizUnitCost=uc;
    S.stand.stock+=qty; S.stand.price=Math.max(uc/m*2,S.stand.price);
  }
  else if(a==="bizedit"){ S.stand.bizName=null; S.stand._showDetails=false; S.stand.dayOpen=false; S.stand._closeSold=null; S.stand._closeCash=null; }
  else if(a==="bizstock"){ const d=parseInt(v); if(d<0&&S.stand.stock<1)return; S.stand.stock=Math.max(0,S.stand.stock+d); }
  else if(a==="cashinstep"){ const d=parseFloat(v); S.stand.cash=Math.round(Math.max(0,S.stand.cash+d)*100)/100; }
  else if(a==="costinstep"){ const d=parseFloat(v); S.stand.bizUnitCost=Math.round(Math.max(0,Math.min(99,(S.stand.bizUnitCost!=null?S.stand.bizUnitCost:0.25)+d))*100)/100; }
  else if(a==="closesoldstep"){ const d=parseInt(v); const cur=parseFloat(S.stand._closeSold)||0; S.stand._closeSold=String(Math.max(0,cur+d)); }
  else if(a==="closecashstep"){ const d=parseFloat(v); const cur=parseFloat(S.stand._closeCash)||0; S.stand._closeCash=String(Math.round(Math.max(0,cur+d)*100)/100); }
  else if(a==="buy"){ const uc=S.stand.bizUnitCost!=null?S.stand.bizUnitCost:S.stand.unitCost; const c=10*uc; if(c>0&&S.stand.cash<c){toast(L.noCash);return;} S.stand.cash-=c; S.stand.stock+=10; }
  else if(a==="price"){ S.stand.price=Math.min(99,Math.max(0.01,S.stand.price+parseFloat(v))); }
  else if(a==="openday"){ S.stand.dayOpen=true; S.stand._closeSold=null; S.stand._closeCash=null; S.stand.openedAt=new Date().toISOString(); }
  else if(a==="cancelday"){ S.stand.dayOpen=false; S.stand._closeSold=null; S.stand._closeCash=null; }
  else if(a==="closeday"){
    const sold=parseFloat(S.stand._closeSold)||0;
    const cashN=parseFloat(S.stand._closeCash)||0;
    if(sold<=0&&cashN<=0){ toast(L.noStock?L.noStock(item()):"Enter sales first"); return; }
    const unitC=S.stand.bizUnitCost!=null?S.stand.bizUnitCost:(S.stand.unitCost!=null?S.stand.unitCost:0.25);
    const cost=sold*unitC;
    S.stand.stock=Math.max(0,S.stand.stock-sold);
    S.stand.cash+=cashN;
    const stopTime=S.stand.stopTime||null;
    S.stand.last={day:S.stand.day,sold,rev:cashN,cost,openedAt:S.stand.openedAt||new Date().toISOString(),startTime:S.stand.startTime||null,stopTime};
    S.stand.history.push({day:S.stand.day,rev:cashN,cost,sold,startTime:S.stand.startTime||null,stopTime});
    S.stand.day++; S.stand.dayOpen=false; S.stand._closeSold=null; S.stand._closeCash=null; S.stand.startTime=''; S.stand.stopTime='';
    toneChing(); toast(S.lang==="es"?"¡Día cerrado!":S.lang==="pt"?"Dia fechado!":"Day closed!");
    lessonAfter("profit");
  }
  else if(a==="open"){ openStand(); if(S.stand.last) lessonAfter("profit"); }
  else if(a==="payout"){ const amt=S.stand.cash-5; if(amt<=0) return; S.stand.cash=5; payIntoJars(amt); logMove("biz",amt); toneChing(); toast(L.movedJars(money(amt))); S.tab="home"; }
  else if(a==="payoutpct"){ const pct=parseInt(v); const amt=Math.round(S.stand.cash*pct)/100; if(amt<=0) return; S.stand._payoutInput=amt.toFixed(2); }
  else if(a==="payoutamt"){
    const el=document.getElementById("payoutCustom");
    const rawVal=el?.value||S.stand._payoutInput||'';
    const totalBefore=S.stand.cash;
    const amt=Math.round(Math.min(totalBefore,Math.max(0.01,parseFloat(rawVal)||0))*100)/100;
    if(amt<=0){ toast(S.lang==="es"?"Ingresa una cantidad":S.lang==="pt"?"Digite um valor":"Enter an amount"); return; }
    const pct=totalBefore>0?(amt/totalBefore)*100:0;
    S.stand.cash=Math.round((totalBefore-amt)*100)/100;
    S.stand._payoutInput=null;
    payIntoJars(amt); logMove("biz",amt); toneWin();
    S.modal={type:"paywin",amt,pct};
    confetti();
  }
  else if(a==="giftopen"){ S.modal={id:+v,stage:"box"}; }
  else if(a==="unwrap"){ const x=S.gifts.find(y=>y.id==v); if(x&&!x.opened){ x.opened=true; payIntoJars(x.amt); logMove("gift",x.amt,{n:esc(gname(x))}); } S.modal={id:+v,stage:"open"}; render(); confetti(); toneGift(); return; }
  else if(a==="giftclose"){ S.modal=null; flash="jars"; lessonAfter("save"); }
  else if(a==="ff"){ const k=b.dataset.k; if(k==="amt"){ S.ff.amt=+v; S.ff.custom=""; } else S.ff[k]=v; if(k==="occ") S.ff.when="day"; }
  else if(a==="ffsend"){
    const f=F[S.lang], ff=S.ff, m=CC().mult;
    if(!ff.name.trim()){ toast(SF[S.lang].pickFirst); return; }
    const amt = ff.custom ? parseFloat(ff.custom)/m : ff.amt; if(!(amt>0)) return;
    const od=occDate(ff.occ), id=Date.now();
    // custom open date wins; fallback to occasion date if "on the day" was chosen
    const opensDate = (ff.openDate && ff.openDate > todayISO()) ? ff.openDate : (ff.when==="day"&&od) ? od : null;
    S.gifts.push({id,name:ff.name.trim(),giver:ff.giver,occ:ff.occ,amt,note:ff.note.trim()||G[S.lang].occs[ff.occ]+"!",method:ff.method||PAY[S.country][0],status:"awaiting",opens:opensDate,opened:false,msg:ff.msg||null});
    ff.sent=id; ff.msg=null; ff.note=""; ff.custom=""; ff.openDate=""; window.scrollTo(0,0);
  }
  else if(a==="ffagain"){ S.ff.sent=null; }
  else if(a==="cchk"){ A.cdraft=A.cdraft||{name:"",email:"",c1:false,c2:false,c3:false};
    A.cdraft.name=document.getElementById("cname").value; A.cdraft.email=document.getElementById("cmail").value;
    A.cdraft[v]=!A.cdraft[v]; }
  else if(a==="cdone"){ const c=CN[S.lang], d=A.cdraft||{}, nm=document.getElementById("cname").value.trim(), em=document.getElementById("cmail").value.trim();
    A.cdraft={...d,name:nm,email:em,suggest:null};
    if(!nm||!d.c1||!d.c2||!d.c3){ toast(c.need); render(); return; }
    const mp=mailProblem(em);
    if(mp){ if(mp.k==="typo"){ A.cdraft.suggest=mp.fix; toast(c.didYouMean(mp.fix)); }
      else toast(mp.k==="fake"?c.fakeMail:c.badMail);
      render(); return; }
    const pinEl=document.getElementById("cpin"), pv=(pinEl?pinEl.value:"1234").trim();
    if(!/^\d{4}$/.test(pv)){ A.cdraft.pin=pv; toast(c.badPin); render(); return; }
    A.pin=pv; A.consent={name:nm,email:em,at:todayISO(),ver:"1.0"}; A.cdraft=null; appUnlocked=true; }
  else if(a==="usemail"){ A.cdraft={...(A.cdraft||{}),email:v,suggest:null}; }
  else if(a==="crevoke"){ if(confirm(CN[S.lang].revokeQ)){ A.consent=null; A.mode="kid"; parentOpen=false; } }
  else if(a==="ffopendate"){ S.ff.openDate=v||""; }
  else if(a==="ffwho"){ const p=A.family.find(y=>y.id==v); if(p){ S.ff.senderId=p.id; S.ff.name=p.name; S.ff.giver=p.rel; } }
  else if(a==="ffrec"){ S.modal={type:"rec",kind:v,stage:"idle"}; }
  else if(a==="ffdelmsg"){ if(S.ff.msg) delete MSG[S.ff.msg.mid]; S.ff.msg=null; }
  else if(a==="recstart"){ startRec(); return; }
  else if(a==="recstop"){ stopRec(); return; }
  else if(a==="recuse"){ const md=S.modal; S.ff.msg={type:md.kind==="video"?"video":"audio",dur:md.dur,mid:md.mid,approved:false,demo:md.fallback}; S.modal=null; }
  else if(a==="review"){ const x=S.gifts.find(y=>y.id==v); if(x) S.modal={type:"review",gift:x}; }
  else if(a==="savemsg"){ saveMsg(v); return; }
  else if(a==="okmsg"){ S.modal.gift.msg.approved=true; S.modal=null; toast(SF[S.lang].approvedMsg); }
  else if(a==="delmsg"){ const x=S.modal.gift; if(x.msg){ delete MSG[x.msg.mid]; x.msg=null; } S.modal=null; toast(SF[S.lang].deletedMsg); }
  else if(a==="blockmsg"){ const x=S.modal.gift, nm=gname(x); const p=A.family.find(y=>y.name===x.name); if(p) p.blocked=true;
    if(x.msg){ delete MSG[x.msg.mid]; x.msg=null; } S.modal=null; toast(SF[S.lang].blockedMsg(nm)); }
  else if(a==="addfam"){ const sf=SF[S.lang], el=document.getElementById("newfam"), n=el.value.trim(); if(!n){ el.focus(); return; }
    A.family.push({id:Date.now(),name:n,rel:"tia",blocked:false}); toast(sf.added(n)); }
  else if(a==="togglefam"){ const p=A.family.find(y=>y.id==v); if(p) p.blocked=!p.blocked; }
  else if(a==="delfam"){ const p=A.family.find(y=>y.id==v); if(p&&confirm(SF[S.lang].removeQ(p.name))) A.family=A.family.filter(y=>y.id!=v); }
  else if(a==="confirmgift"){ const x=S.gifts.find(y=>y.id==v); if(x){ x.status="ready"; toast(F[S.lang].confirmed); } }
  else if(a==="skipday"){ S.gifts.forEach(x=>{ if(!x.opened&&x.status!=="awaiting"&&!unlocked(x)) x.opens=null; }); S.mode="kid"; S.tab="home"; toast(F[S.lang].skipped); }
  else if(a==="copylink"){ const l="https://"+giftLink(), f=F[S.lang];
    try{ navigator.clipboard.writeText(l).then(()=>toast(f.copied),()=>toast(l)); }catch(err){ toast(l); } return; }
  else if(a==="reset"){ const cc=A.country, lang=A.lang; A=SAMPLE(cc); A.lang=lang; A.mode="parent"; parentOpen=true; toast(T[lang].resetDone); }
  else if(a==="pickkid"){ A.cur=+v; if(S.mode==="kid") window.scrollTo(0,0); }
  else if(a==="newkidgender"){ _nkg=v; }
  else if(a==="addkid"){ const kk=K[S.lang], n=document.getElementById("newkid").value.trim(); if(!n) { document.getElementById("newkid").focus(); return; }
    if(A.kids.length>=5){ toast(kk.full); return; } A.kids.push(makeKid(n,"01-01","b",{gender:_nkg})); A.cur=A.kids.length-1; toast(kk.added(n)); }
  else if(a==="removekid"){ if(A.kids.length>1 && confirm(K[S.lang].removeQ(S.kidName))){ A.kids.splice(A.cur,1); A.cur=0; } }
}

render();
</script>
